resources:
  pipelines:
    web_events:
      name: web_events
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      root_path: ../src/web_events
      libraries:
        - glob:
            include: ../src/web_events/transformations/**
      configuration:
        factory.landing_root: ${var.landing_root}
        # event feeds shared with downstream teams: one materialized view per entry
        factory.feeds: '[{"table": "gold.events_export", "event_types": ["checkout", "purchase"]}]'
